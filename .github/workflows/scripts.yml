name: Script tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - 'infra/docker/**'
      - '.github/workflows/scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - 'infra/docker/**'
      - '.github/workflows/scripts.yml'

permissions:
  contents: read

jobs:
  keycloak-realm-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/tests/keycloak-apply-realm-settings-test.sh
      - run: ./scripts/tests/keycloak-realm-config-test.sh

  dev-env-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/tests/dev-env-smoke.sh
