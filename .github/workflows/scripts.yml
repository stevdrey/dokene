name: Script tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - 'infra/docker/**'
      - '.github/workflows/scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - 'infra/docker/**'
      - '.github/workflows/scripts.yml'

permissions:
  contents: read

jobs:
  keycloak-realm-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/keycloak-apply-realm-settings-test.sh
      - run: ./scripts/tests/keycloak-realm-config-test.sh

  dev-env-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/dev-env-smoke.sh

  operator-journey-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/verify-journey-follow-up-disposition-test.sh

  bff-login-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/bff-login-test.sh
