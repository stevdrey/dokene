name: Agent PR Preflight Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.agents/scripts/issue-loop.mjs'
      - '.agents/scripts/issue-loop.test.mjs'
      - '.agents/scripts/pr-size-preflight.mjs'
      - '.agents/scripts/pr-size-preflight.test.mjs'
      - '.agents/scripts/verification-verdict.mjs'
      - '.agents/scripts/verification-verdict.test.mjs'
      - '.claude/settings.json'
      - '.codex/hooks.json'
      - '.github/workflows/pr-preflight-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Agent PR preflight tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test .agents/scripts/pr-size-preflight.test.mjs
      - run: node --test .agents/scripts/verification-verdict.test.mjs
      - run: node --test .agents/scripts/issue-loop.test.mjs
