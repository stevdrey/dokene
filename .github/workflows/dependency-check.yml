name: OWASP Dependency Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/build.gradle'
      - 'backend/config/dependency-check-suppressions.xml'
      - 'backend/gradlew'
      - 'backend/gradlew.bat'
      - 'backend/settings.gradle'
      - 'backend/gradle/**'
      - '.github/workflows/dependency-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/build.gradle'
      - 'backend/config/dependency-check-suppressions.xml'
      - 'backend/gradlew'
      - 'backend/gradlew.bat'
      - 'backend/settings.gradle'
      - 'backend/gradle/**'
      - '.github/workflows/dependency-check.yml'
  schedule:
    - cron: '7 5 * * 1'

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '26'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore Dependency-Check data cache
        id: dependency-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-

      - name: Run OWASP Dependency-Check
        env:
          DOKENE_NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Save Dependency-Check data cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check-report.*
          if-no-files-found: warn
