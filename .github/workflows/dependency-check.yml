name: OWASP Dependency Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/build.gradle'
      - 'backend/config/dependency-check-suppressions.xml'
      - 'backend/gradlew'
      - 'backend/gradlew.bat'
      - 'backend/settings.gradle'
      - 'backend/gradle/**'
      - '.github/workflows/dependency-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/build.gradle'
      - 'backend/config/dependency-check-suppressions.xml'
      - 'backend/gradlew'
      - 'backend/gradlew.bat'
      - 'backend/settings.gradle'
      - 'backend/gradle/**'
      - '.github/workflows/dependency-check.yml'
  schedule:
    - cron: '7 5 * * 1'

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore Dependency-Check data cache
        id: dependency-check-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-

      - name: Run OWASP Dependency-Check
        env:
          DOKENE_NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Save Dependency-Check data cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check-report.*
          if-no-files-found: warn
