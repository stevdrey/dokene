# ABOUTME: Fails any pull request that references a GitHub Action by a tag, branch or short SHA (issue #309, audit M5).
# ABOUTME: Runs on every pull request and push to main with no paths filter, so it can be made a required check safely.
name: Workflow pins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-workflow-pins:
    name: Workflow pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/check-workflow-pins-test.sh
