# ABOUTME: Fails any pull request that references a GitHub Action by a tag, branch or short SHA (issue #309, audit M5),
# ABOUTME: or a container image without tag plus digest, or drops the Gradle wrapper checksum (issue #323, audit L13).
# Runs on every pull request and push to main with no paths filter, so it can be made a required check safely.
name: Workflow pins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-workflow-pins:
    name: Workflow pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/check-workflow-pins-test.sh

  # The same test on macOS, where find is BSD find and /bin/bash is bash 3.2 (issue #370): the check tolerates BSD
  # find's link loop messages by their wording, which the Linux job cannot exercise.
  check-workflow-pins-macos:
    name: Workflow pins (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The check starts with `#!/usr/bin/env bash`, and the runner puts a newer bash first on PATH; a link to
      # /bin/bash in front makes the check itself run on 3.2, not only the test.
      - name: Put the system bash and find first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/system-tools"
          ln -s /bin/bash "$RUNNER_TEMP/system-tools/bash"
          ln -s /usr/bin/find "$RUNNER_TEMP/system-tools/find"
          echo "$RUNNER_TEMP/system-tools" >> "$GITHUB_PATH"
      - name: Show the toolchain
        run: |
          sw_vers
          env bash --version | head -n 1
          command -v find
      - run: bash scripts/tests/check-workflow-pins-test.sh

  image-pins:
    name: image-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/check-image-pins-test.sh
      - run: ./scripts/check-image-pins.sh
      - name: Gradle wrapper distribution checksum is set
        run: grep -Eq '^distributionSha256Sum=[0-9a-f]{64}$' backend/gradle/wrapper/gradle-wrapper.properties
