name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'scripts/check-java4shell-runtime.sh'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'scripts/check-java4shell-runtime.sh'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          # check-latest: the runner's cached Temurin can predate the Java4Shell fix (CVE-2026-114938, issue 429).
          check-latest: true
      - name: Require a Java4Shell-fixed JDK
        run: ../scripts/check-java4shell-runtime.sh --require-patched
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew test
