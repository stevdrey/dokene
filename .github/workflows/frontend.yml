name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'infra/docker/frontend/**'
      - 'scripts/tests/nginx-headers-smoke.sh'
      - 'scripts/tests/nginx-login-rate-limit-smoke.sh'
      - 'backend/src/test/resources/contracts/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'infra/docker/frontend/**'
      - 'scripts/tests/nginx-headers-smoke.sh'
      - 'scripts/tests/nginx-login-rate-limit-smoke.sh'
      - 'backend/src/test/resources/contracts/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm test
      - run: npm run build

  nginx-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/nginx-headers-smoke.sh
      - run: ./scripts/tests/nginx-login-rate-limit-smoke.sh
