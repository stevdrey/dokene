# ABOUTME: Outer proxies (a tunnel or load balancer in front of this edge) whose X-Forwarded-For the edge believes (spec 0018).
# ABOUTME: Ships empty, so no peer is trusted. Mount your own file over /etc/nginx/snippets/trusted-proxies.conf to trust one.
#
# Only `set_real_ip_from <address or CIDR>;` lines belong in this file, one per trusted proxy, for example:
#
#   set_real_ip_from 172.20.0.5;
#   set_real_ip_from 10.0.0.0/24;
#
# List addresses in plain form: IPv4 as IPv4 (10.0.0.5), not as IPv4 mapped IPv6 (::ffff:10.0.0.5).
# List only proxies you run, never a broad range such as 0.0.0.0/0 or ::/0: any client inside a listed range can send
# its own X-Forwarded-For, choose the address the edge restores, and so escape the login start and webhook limits.
# From a listed proxy the edge takes the client address only: the rightmost address in its X-Forwarded-For that is not
# itself listed. When every address in that header is listed, nginx uses the leftmost one. An entry that is not an
# address leaves the proxy's own address in place; an address with a port (203.0.113.7:4321) is used without the port.
# The scheme is never taken from a proxy; the edge always sends its own.
# nginx refuses to start when this file is invalid, so a mistake fails closed instead of trusting the wrong peer.
# The header source (real_ip_header X-Forwarded-For) and the recursive lookup are set in nginx.conf, not here.
