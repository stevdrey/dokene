# ABOUTME: Every request header the edge sets toward the backend (issue 320, spec 0018). Included by each proxy_pass location.
# ABOUTME: Drops every client supplied forwarding header and sets X-Forwarded-For, -Proto and -Port from the edge itself.
#
# Keep every proxy_set_header line in this file. nginx inherits proxy_set_header from an outer level only when a block
# defines none of its own, so a stray line in one location would silently drop all of these there.
# A header set here replaces any header of that name the client sent, repeated or in any letter case, and an empty value
# makes nginx omit it.

# The OIDC redirect URI registered in Keycloak is http://localhost:8080/login/oauth2/code/dokene.
# Presenting that Host to the backend mirrors Vite's `changeOrigin: true`, and it is what pins {baseUrl}.
proxy_set_header Host localhost:8080;
proxy_set_header Connection "";

# The client address: the peer, or the client address restored by the realip module when the peer is listed in
# trusted-proxies.conf. The scheme is always the edge's own; a trusted proxy's scheme is not believed (feature 15).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Under `framework`, Spring clears the port when it sees X-Forwarded-Proto and restores it only from X-Forwarded-Port,
# so without this line {baseUrl} loses :8080 and Keycloak refuses the redirect URI. Keep it equal to the Host port.
proxy_set_header X-Forwarded-Port 8080;

# Never sent, whatever the client sent. The backend ignores most of these today, but `framework`, `native` or a future
# filter would read them.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Original-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Client-IP "";
proxy_set_header True-Client-IP "";
