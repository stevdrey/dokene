# Response headers for every SPA (static) location. BFF routes are proxied untouched: the backend owns those headers. `add_header` is only inherited from the enclosing level when a block
# defines none of its own, so each static location includes this file instead of relying on server-level inheritance.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
