# Content-Security-Policy for the SPA (HTML, bundles, fonts). Everything is same-origin: scripts, styles and fonts are
# self-hosted (no third-party hosts), the browser talks only to the Dokene BFF on the same origin, and the page cannot
# be framed. React applies `style={...}` through the CSSOM, which `style-src 'self'` does not block.
include /etc/nginx/snippets/security-headers-base.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
