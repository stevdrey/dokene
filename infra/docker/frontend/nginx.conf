# Same-origin entry point for the browser (http://localhost:5173), mirroring the Vite dev proxy in
# frontend/vite.config.ts: static assets are served here, BFF routes are proxied to the backend.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolve `backend` at request time so nginx can start before the backend is healthy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api|oauth2|login|logout)(/|$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # The OIDC redirect URI registered in Keycloak is http://localhost:8080/login/oauth2/code/dokene.
        # Presenting that Host to the backend mirrors Vite's `changeOrigin: true`.
        proxy_set_header Host localhost:8080;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_redirect off;

        # Response security headers for these routes (CSP, Permissions-Policy, ...) are set by the backend
        # (TenantSecurityConfiguration) and passed through unchanged.
    }

    # Hashed build assets are immutable; the HTML entry point must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers-spa.conf;
        try_files $uri =404;
    }

    # Fonts are unhashed: cache for 30 days, and rename the file when a font changes.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers-spa.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers-spa.conf;
        try_files $uri /index.html;
    }
}
