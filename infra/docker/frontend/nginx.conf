# Same-origin entry point for the browser (http://localhost:5173), mirroring the Vite dev proxy in
# frontend/vite.config.ts: static assets are served here, BFF routes are proxied to the backend.

# Webhook requests in progress (issue 306). The first zone has one key for every client, an aggregate bound; the
# second is per client address, so one source cannot hold every aggregate slot with slow uploads. Behind another
# proxy or tunnel every client has that proxy's address: restore the real one (real_ip) or the per-address limit
# becomes a global limit of 8.
limit_conn_zone $server_name zone=webhook_uploads:1m;
limit_conn_zone $binary_remote_addr zone=webhook_uploads_per_ip:10m;

# Login starts (issue 311). A login start is the one anonymous request that makes the backend create a session, so it
# is bounded per client address: 30 per minute, with a burst of 10. The key is empty for every other path, and nginx
# does not limit a request whose key is empty. Behind another proxy or tunnel every client has that proxy's address:
# restore the real one (real_ip) or this becomes one limit shared by everyone who signs in.
map $uri $login_start_key {
    ~^/oauth2/authorization/ $binary_remote_addr;
    default "";
}
limit_req_zone $login_start_key zone=login_starts:10m rate=30r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolve `backend` at request time so nginx can start before the backend is healthy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Trusted outer proxies (issue 320, spec 0018). The shipped file lists none, so $remote_addr is always the peer.
    # For a listed peer, realip replaces $remote_addr with the rightmost address in its X-Forwarded-For that is not
    # itself listed. It runs here, at server level, before limit_req and limit_conn, so the login and webhook limits
    # key on the restored address. The header source is fixed here so the operator file cannot change it.
    include /etc/nginx/snippets/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location ~ ^/(api|oauth2|login|logout)(/|$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # Every header sent upstream (Host, the client address, the scheme, and the forwarding headers that are
        # dropped) lives in this one snippet. No location sets its own proxy_set_header.
        include /etc/nginx/snippets/proxy-upstream.conf;
        proxy_http_version 1.1;
        proxy_redirect off;

        # Only login starts carry a key (see login_starts above). A refused one is answered here with 429 and never
        # reaches the backend. Refusals log at info, below the default error_log level, so a flood cannot flood the
        # proxy log. proxy_intercept_errors stays off, so a 429 from the backend itself passes through unchanged.
        limit_req zone=login_starts burst=10 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 = @login_rate_limited;

        # Response security headers for these routes (CSP, Permissions-Policy, ...) are set by the backend
        # (TenantSecurityConfiguration) and passed through unchanged.
    }

    # At 30 per minute one slot frees every 2 seconds.
    location @login_rate_limited {
        include /etc/nginx/snippets/security-headers-base.conf;
        add_header Retry-After 2 always;
        default_type text/plain;
        return 429 "Too many sign in attempts. Try again in a moment.\n";
    }

    # Meta WhatsApp callbacks (issue 139). Unauthenticated by design: the backend's /webhooks/** chain trusts only the
    # HMAC over the raw body, so the body is passed through unchanged and capped at the backend's 4 MiB
    # default (dokene.integration.whatsapp.webhook.max-body-bytes); nginx's own default of 1 MiB would refuse
    # legitimate batches, which Meta documents up to 3 MB.
    location ~ ^/webhooks(/|$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy-upstream.conf;
        proxy_http_version 1.1;
        proxy_redirect off;
        client_max_body_size 4m;
        # Required, not just default (issue 306): the backend holds an admission permit and a Tomcat worker while it
        # reads a body, so the edge must deliver whole bodies. A stalled upload is cut here instead of starving them.
        proxy_request_buffering on;
        client_body_timeout 10s;
        # Bodies are buffered under /tmp, a size-capped tmpfs (compose.yaml), before the backend sees them. At most 16
        # webhook requests are in progress at once, 8 per client address, so buffered webhook bodies stay under
        # 16 x 4 MiB = 64 MiB; the next one gets 503, which Meta retries. Refusals log at info, below the default
        # error_log level, so a flood cannot flood the proxy log either.
        limit_conn webhook_uploads 16;
        limit_conn webhook_uploads_per_ip 8;
        limit_conn_status 503;
        limit_conn_log_level info;
        # nginx warns once per body it buffers to a file, i.e. once per real webhook batch over 16 KiB and once per
        # forged one; errors still reach the log.
        error_log /dev/stderr error;
    }

    # Hashed build assets are immutable; the HTML entry point must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers-spa.conf;
        try_files $uri =404;
    }

    # Fonts are unhashed: cache for 30 days, and rename the file when a font changes.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers-spa.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers-spa.conf;
        try_files $uri /index.html;
    }
}
