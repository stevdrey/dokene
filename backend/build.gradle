plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'io.github.stevdrey.dokene'
version = '0.0.1-SNAPSHOT'

description = 'Dokene backend'

// Remove once Spring Boot manages Tomcat 11.0.25 or later.
ext['tomcat.version'] = '11.0.25'
// Override Kotlin version to address CVE-2026-53914 in transitive dependencies of com.openai:openai-java
ext['kotlin.version'] = '2.4.20'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Provides Micrometer MeterRegistry only; every actuator endpoint stays disabled and unexposed (see application.yml).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.40'
    implementation 'com.openai:openai-java:4.73.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // Module dependency rules from ADR 0023 §1 (ModuleDependencyArchitectureTest).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
}

tasks.named('test') {
    // Live-provider evaluation is opt-in (see aiEvalLive); it must never run, cost money or need a key in normal CI.
    useJUnitPlatform {
        excludeTags 'ai-eval-live'
    }
}

// Opt-in live evaluation of the configured provider against the synthetic dataset (Issue #98, ADR 0021).
// Requires DOKENE_AI_EVAL_LIVE=true and DOKENE_AI_OPENAI_API_KEY; skipped otherwise. Deliberately not part of `check`.
tasks.register('aiEvalLive', Test) {
    description = 'Runs the opt-in live AI evaluation (may incur provider cost).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ai-eval-live'
    }
    ['DOKENE_AI_EVAL_LIVE', 'DOKENE_AI_OPENAI_API_KEY', 'DOKENE_AI_OPENAI_MODEL', 'DOKENE_AI_OPENAI_BASE_URL',
     'DOKENE_AI_EVAL_PROMPT_POLICY', 'DOKENE_AI_EVAL_PRICE_INPUT_PER_MTOK', 'DOKENE_AI_EVAL_PRICE_OUTPUT_PER_MTOK',
     'DOKENE_AI_EVAL_REPORT_NAME', 'DOKENE_AI_EVAL_MIN_SUCCESS_RATIO'].each { name ->
        System.getenv(name)?.with { value -> environment name, value }
    }
    outputs.upToDateWhen { false }
}

// Compares two evaluation reports: ./gradlew aiEvalCompare -Pbaseline=<report.json> -Pcandidate=<report.json>
// Exits non-zero on a hard-invariant regression; quality, latency and token deltas are only displayed.
tasks.register('aiEvalCompare', JavaExec) {
    description = 'Compares two AI evaluation reports (baseline vs candidate).'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.stevdrey.dokene.ai.eval.EvalReportComparator'
    dependsOn tasks.named('testClasses')
    doFirst {
        if (!project.hasProperty('baseline') || !project.hasProperty('candidate')) {
            throw new GradleException('Usage: ./gradlew aiEvalCompare -Pbaseline=<report.json> -Pcandidate=<report.json>')
        }
        args file(project.property('baseline')).absolutePath, file(project.property('candidate')).absolutePath
    }
}
def nvdApiKey = (System.getenv('DOKENE_NVD_API_KEY') ?: System.getenv('NVD_API_KEY'))?.trim()

dependencyCheck {
    failBuildOnCVSS = 7.0
    failOnError = true
    formats = ['HTML', 'JSON']
    suppressionFile = 'config/dependency-check-suppressions.xml'
    data.directory = "${gradle.gradleUserHomeDir}/dependency-check-data"

    if (nvdApiKey) {
        nvd.apiKey = nvdApiKey
    }
}
