plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'io.github.stevdrey.dokene'
version = '0.0.1-SNAPSHOT'

description = 'Dokene backend'

// Remove once Spring Boot manages Tomcat 11.0.25 or later.
ext['tomcat.version'] = '11.0.25'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

def nvdApiKey = System.getenv('DOKENE_NVD_API_KEY')?.trim()

dependencyCheck {
    failBuildOnCVSS = 7.0
    failOnError = true
    formats = ['HTML', 'JSON']
    suppressionFile = 'config/dependency-check-suppressions.xml'
    data.directory = "${gradle.gradleUserHomeDir}/dependency-check-data"

    if (nvdApiKey) {
        nvd.apiKey = nvdApiKey
    }
}
