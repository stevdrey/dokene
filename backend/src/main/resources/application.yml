spring:
  application:
    name: dokene
  config:
    # Secrets mounted as files (Compose secrets, issue 308): each file name is a property name, so
    # /run/secrets/dokene/DOKENE_TENANT_CONTEXT_SIGNING_KEY resolves ${DOKENE_TENANT_CONTEXT_SIGNING_KEY} without exposing
    # the value in the process environment. A directory of its own, so unrelated mounted secrets (for example a
    # Kubernetes service-account token) never become properties. Host-run backends keep using environment variables.
    import: optional:configtree:/run/secrets/dokene/
  datasource:
    url: ${DOKENE_DB_URL}
    username: ${DOKENE_DB_USERNAME}
    password: ${DOKENE_DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO dokene
      # Milliseconds a request waits for a pooled connection before failing with 503 (issue 246). Hikari's 30 s
      # default left callers hanging through a database outage. Startup refuses less than 500.
      connection-timeout: ${DOKENE_DB_CONNECTION_TIMEOUT_MS:3000}
      # Liveness check of an idle pooled connection before it is handed out. Hikari does not keep it below
      # connection-timeout, so TenantPersistenceConfiguration caps it at half the pool wait (never below 250).
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: dokene
  flyway:
    # The backend connects as the runtime role and only validates the schema (RuntimeSchemaValidationConfiguration);
    # the one-shot migration job (DokeneMigrationApplication, profile `migration`) applies it (issue 308).
    enabled: true
    url: ${DOKENE_DB_URL}
    user: ${DOKENE_DB_USERNAME}
    password: ${DOKENE_DB_PASSWORD}
    schemas: dokene
    default-schema: dokene
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

dokene:
  datasource:
    # Retry-After on the empty 503 answered while the database is unreachable (issue 246, ADR 0029).
    unavailable-retry-after: ${DOKENE_DB_UNAVAILABLE_RETRY_AFTER:5s}
    # Ceiling on one blocking read from PostgreSQL (pgJDBC socketTimeout, whole seconds rounded up; off by default in
    # the driver). Only a silent network reaches it: the driver then reports a lost connection, answered with 503.
    socket-timeout: ${DOKENE_DB_SOCKET_TIMEOUT:30s}
    # Server-side statement_timeout of the runtime pool, shorter than socket-timeout, so a statement or lock wait that
    # is merely long is cancelled as query_canceled (not an outage) and keeps its connection. Startup checks the order.
    statement-timeout: ${DOKENE_DB_STATEMENT_TIMEOUT:25s}
  ai:
    provider: ${DOKENE_AI_PROVIDER:}
    rate-limit:
      tenant-permits-per-minute: ${DOKENE_AI_RATE_LIMIT_TENANT_PERMITS:60}
      actor-permits-per-minute: ${DOKENE_AI_RATE_LIMIT_ACTOR_PERMITS:20}
      retry-after: ${DOKENE_AI_RATE_LIMIT_RETRY_AFTER:5s}
    openai:
      api-key: ${DOKENE_AI_OPENAI_API_KEY:}
      model: ${DOKENE_AI_OPENAI_MODEL:gpt-6-luna}
      # Validated at startup (issue 322): https on api.openai.com (the default when blank), an exact loopback test
      # server, or an https host listed in additional-trusted-hosts; never user info, query or fragment.
      base-url: ${DOKENE_AI_OPENAI_BASE_URL:}
      # Comma-separated exact host names that may receive the API key and customer data. Empty by default.
      additional-trusted-hosts: ${DOKENE_AI_OPENAI_ADDITIONAL_TRUSTED_HOSTS:}
      timeout: ${DOKENE_AI_OPENAI_TIMEOUT:15s}
      max-retries: ${DOKENE_AI_OPENAI_MAX_RETRIES:0}
      max-output-tokens: ${DOKENE_AI_OPENAI_MAX_OUTPUT_TOKENS:}
    retry:
      max-attempts: ${DOKENE_AI_RETRY_MAX_ATTEMPTS:2}
      initial-backoff: ${DOKENE_AI_RETRY_INITIAL_BACKOFF:250ms}
      max-backoff: ${DOKENE_AI_RETRY_MAX_BACKOFF:2s}
      min-attempt-budget: ${DOKENE_AI_RETRY_MIN_ATTEMPT_BUDGET:1s}
  integration:
    whatsapp:
      # Deployment secret references for the Meta webhook verifier (spec 0007): bare keys of the APP_SECRET and
      # WEBHOOK_VERIFY_TOKEN entries, never the secrets. Blank keeps that path refusing every request.
      verify-token-ref: ${DOKENE_INTEGRATION_WHATSAPP_VERIFY_TOKEN_REF:}
      app-secret-ref: ${DOKENE_INTEGRATION_WHATSAPP_APP_SECRET_REF:}
      webhook:
        # Largest webhook body read, in bytes (1 to 16777216). Meta documents payloads up to 3 MB.
        max-body-bytes: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_MAX_BODY_BYTES:4194304}
        # Callbacks read and processed at once (1 to 64, issue 306); one more is refused with 503 and Retry-After
        # before a byte is read. Webhook body heap is at most about this times max-body-bytes (32 MiB by default).
        max-concurrent-requests: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_MAX_CONCURRENT_REQUESTS:8}
        # Durable webhook inbox (issue 139, ADR 0030): the sweeper applies PENDING rows and purges old terminal ones.
        inbox:
          enabled: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_INBOX_ENABLED:true}
          interval: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_INBOX_INTERVAL:PT30S}
          # How long a report whose message is not found yet is retried before it is dropped (0 to 1 hour).
          park-window: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_INBOX_PARK_WINDOW:PT15M}
          # A row still failing this long after receipt is abandoned (at least 1 hour and the park window).
          abandon-after: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_INBOX_ABANDON_AFTER:P1D}
          # How long processed rows are kept for deduplication; at least 8 days (beyond Meta's 7 day retries) and abandon-after.
          retention: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_INBOX_RETENTION:P30D}
          batch-size: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_INBOX_BATCH_SIZE:100}
          # New rows a request applies before answering (0 to 1000); the sweeper applies the rest.
          inline-limit: ${DOKENE_INTEGRATION_WHATSAPP_WEBHOOK_INBOX_INLINE_LIMIT:50}
      # Phone numbers already mapped by another tenant, per sliding window, before mapping changes get 429 (issue 208).
      mapping-rejection-limit:
        tenant-rejections: ${DOKENE_WHATSAPP_MAPPING_REJECTION_TENANT_LIMIT:10}
        actor-rejections: ${DOKENE_WHATSAPP_MAPPING_REJECTION_ACTOR_LIMIT:5}
        window: ${DOKENE_WHATSAPP_MAPPING_REJECTION_WINDOW:15m}
      # Ownership proofs that reach the provider, whatever their outcome, per tenant and per member (issue 321).
      ownership-verification-limit:
        tenant-calls: ${DOKENE_WHATSAPP_OWNERSHIP_VERIFICATION_TENANT_LIMIT:30}
        actor-calls: ${DOKENE_WHATSAPP_OWNERSHIP_VERIFICATION_ACTOR_LIMIT:20}
        window: ${DOKENE_WHATSAPP_OWNERSHIP_VERIFICATION_WINDOW:15m}
    secrets:
      # Blank keeps the resolver disabled (fail closed); `local` reads entries from
      # DOKENE_INTEGRATION_SECRETS_LOCAL_ENTRIES_<n>_* or a mounted file (spec 0006).
      source: ${DOKENE_INTEGRATION_SECRETS_SOURCE:}
  messaging:
    # Manual dispatch send policy bounds (issue 138, ADR 0028); the kill switches below and per tenant decide whether a send may go out.
    max-send-attempts: ${DOKENE_MESSAGING_MAX_SEND_ATTEMPTS:3}
    min-contact-interval: ${DOKENE_MESSAGING_MIN_CONTACT_INTERVAL:24h}
    send-rate-per-tenant-per-minute: ${DOKENE_MESSAGING_SEND_RATE_PER_TENANT_PER_MINUTE:30}
    send-timeout: ${DOKENE_MESSAGING_SEND_TIMEOUT:10s}
    english:
      # Writing en-US messages (issue 268), off unless the deployment sets it. Turn it on only once every instance runs
      # this release: an earlier release cannot read an en-US row, so rolling back past this release is unsafe after.
      enabled: ${DOKENE_MESSAGING_ENGLISH_ENABLED:false}
    outbound:
      # Global kill switch (spec 0008): off unless the deployment sets it; read once at startup, so changing it needs
      # a restart. No API, tenant setting or header can turn it on.
      enabled: ${DOKENE_MESSAGING_OUTBOUND_ENABLED:false}
    recovery:
      # Turns STARTED claims older than claim-timeout into unknown outcomes (ADR 0028 §5); never calls the provider.
      # While enabled, startup fails unless claim-timeout >= dokene.messaging.send-timeout + 1m; keep it well above.
      enabled: ${DOKENE_MESSAGING_RECOVERY_ENABLED:true}
      claim-timeout: ${DOKENE_MESSAGING_RECOVERY_CLAIM_TIMEOUT:10m}
      batch-size: ${DOKENE_MESSAGING_RECOVERY_BATCH_SIZE:50}
      interval: ${DOKENE_MESSAGING_RECOVERY_INTERVAL:1m}
  template:
    # How long provider approval evidence stays usable before an explicit refresh (ADR 0025).
    approval-max-age: ${DOKENE_TEMPLATE_APPROVAL_MAX_AGE:24h}
    # Provider requests sent by approval refreshes, whatever the answer, per tenant and per member (issue 321).
    refresh-limit:
      tenant-calls: ${DOKENE_TEMPLATE_REFRESH_TENANT_LIMIT:30}
      actor-calls: ${DOKENE_TEMPLATE_REFRESH_ACTOR_LIMIT:20}
      window: ${DOKENE_TEMPLATE_REFRESH_WINDOW:15m}
  tenant-context:
    signing-key: ${DOKENE_TENANT_CONTEXT_SIGNING_KEY}
    key-id: ${DOKENE_TENANT_CONTEXT_KEY_ID:default}
    # How long a superseded key keeps verifying after the migration job provisions a new key id (issue 324). It must
    # cover the longest rolling deployment plus the 60 s capability lifetime; 0s revokes at once. Range 0s to 7d.
    retirement-grace: ${DOKENE_TENANT_CONTEXT_KEY_RETIREMENT_GRACE:1h}
  security:
    post-login-redirect-url: ${DOKENE_POST_LOGIN_REDIRECT_URL:/}
    post-login-failure-redirect-url: ${DOKENE_POST_LOGIN_FAILURE_REDIRECT_URL:}
    session:
      # Revocation contract (ADR 0007, issue 307): every session ends max-lifetime after login however active; every
      # revalidation-interval its refresh token is redeemed at the provider, so a disabled user or ended provider
      # session is denied within that interval; while the provider is unreachable it survives revalidation-grace.
      max-lifetime: ${DOKENE_SESSION_MAX_LIFETIME:8h}
      revalidation-interval: ${DOKENE_SESSION_REVALIDATION_INTERVAL:5m}
      revalidation-grace: ${DOKENE_SESSION_REVALIDATION_GRACE:15m}
      # Connect and response deadline of one revalidation call; a timeout counts as "provider unreachable".
      revalidation-timeout: ${DOKENE_SESSION_REVALIDATION_TIMEOUT:5s}
      # Only a login start gives an anonymous browser a session (issue 311). Until the login succeeds that session
      # idles out after this long and also ends at this age however often its cookie is used. At least 1s (the servlet
      # container counts whole seconds and reads 0 as "never expire") and at most max-lifetime; startup checks both.
      pre-login-timeout: ${DOKENE_SESSION_PRE_LOGIN_TIMEOUT:5m}
    oidc:
      # Where the back-channel logout handler replays each session's logout. Loopback by default; set it when the
      # provider reaches Dokene through a proxy whose port differs from the one the backend listens on.
      back-channel-logout-uri: ${DOKENE_BACK_CHANNEL_LOGOUT_URI:{baseScheme}://localhost{basePort}/logout/connect/back-channel/{registrationId}}
    cors:
      allowed-origins: ${DOKENE_CORS_ALLOWED_ORIGINS:}

server:
  shutdown: graceful
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: ${DOKENE_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${DOKENE_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    # No actuator endpoint is accessible or exposed; Actuator is on the classpath only to provide Micrometer.
    access:
      default: none
    web:
      exposure:
        include: ""

logging:
  pattern:
    # Server-generated request correlation UUID (see AuditRequestFilter); empty outside a request.
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
