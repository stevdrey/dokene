spring:
  application:
    name: dokene
  datasource:
    url: ${DOKENE_DB_URL}
    username: ${DOKENE_DB_USERNAME}
    password: ${DOKENE_DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO dokene
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: dokene
  flyway:
    enabled: true
    url: ${DOKENE_DB_URL}
    user: ${DOKENE_DB_MIGRATION_USERNAME}
    password: ${DOKENE_DB_MIGRATION_PASSWORD}
    schemas: dokene
    default-schema: dokene
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

dokene:
  tenant-context:
    signing-key: ${DOKENE_TENANT_CONTEXT_SIGNING_KEY}
    key-id: ${DOKENE_TENANT_CONTEXT_KEY_ID:default}
  security:
    cors:
      allowed-origins: ${DOKENE_CORS_ALLOWED_ORIGINS:}

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${DOKENE_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${DOKENE_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    enabled-by-default: false

logging:
  level:
    root: INFO
