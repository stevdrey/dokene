services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DOKENE_DB_NAME:?Set DOKENE_DB_NAME in .env}
      POSTGRES_USER: ${DOKENE_DB_BOOTSTRAP_USERNAME:?Set DOKENE_DB_BOOTSTRAP_USERNAME in .env}
      POSTGRES_PASSWORD: ${DOKENE_DB_BOOTSTRAP_PASSWORD:?Set DOKENE_DB_BOOTSTRAP_PASSWORD in .env}
      DOKENE_DB_MIGRATION_PASSWORD: ${DOKENE_DB_MIGRATION_PASSWORD:?Set DOKENE_DB_MIGRATION_PASSWORD in .env}
      DOKENE_DB_RUNTIME_PASSWORD: ${DOKENE_DB_RUNTIME_PASSWORD:?Set DOKENE_DB_RUNTIME_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - dokene-postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -z "$$KEYCLOAK_ADMIN" ]; then
          echo "Error: Set KEYCLOAK_ADMIN in .env" >&2
          exit 1
        fi
        if [ -z "$$KEYCLOAK_ADMIN_PASSWORD" ]; then
          echo "Error: Set KEYCLOAK_ADMIN_PASSWORD in .env" >&2
          exit 1
        fi
        if [ -z "$$DOKENE_OIDC_CLIENT_SECRET" ]; then
          echo "Error: Set SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_SECRET in .env" >&2
          exit 1
        fi
        escape_json() {
          local str="$$1"
          str="$${str//\\/\\\\}"
          str="$${str//\"/\\\"}"
          str="$${str//$$'\n'/\\n}"
          str="$${str//$$'\r'/\\r}"
          str="$${str//$$'\t'/\\t}"
          printf "%s" "$$str"
        }
        mkdir -p /opt/keycloak/data/import
        content="$$(cat /opt/keycloak/import-template/dokene-realm.json)"
        escaped_secret="$$(escape_json "$$DOKENE_OIDC_CLIENT_SECRET")"
        escaped_password="$$(escape_json "$$DOKENE_TEST_USER_PASSWORD")"
        content="$${content//"\$${env.DOKENE_OIDC_CLIENT_SECRET}"/"$$escaped_secret"}"
        content="$${content//"\$${env.DOKENE_TEST_USER_PASSWORD}"/"$$escaped_password"}"
        printf "%s\n" "$$content" > /opt/keycloak/data/import/dokene-realm.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      DOKENE_OIDC_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_SECRET:-}
      DOKENE_TEST_USER_PASSWORD: ${DOKENE_TEST_USER_PASSWORD:-testpassword}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/docker/keycloak/import:/opt/keycloak/import-template:ro
    healthcheck:
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/dokene/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 40s

volumes:
  dokene-postgres:
