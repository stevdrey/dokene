services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DOKENE_DB_NAME:?Set DOKENE_DB_NAME in .env}
      POSTGRES_USER: ${DOKENE_DB_BOOTSTRAP_USERNAME:?Set DOKENE_DB_BOOTSTRAP_USERNAME in .env}
      POSTGRES_PASSWORD: ${DOKENE_DB_BOOTSTRAP_PASSWORD:?Set DOKENE_DB_BOOTSTRAP_PASSWORD in .env}
      DOKENE_DB_MIGRATION_PASSWORD: ${DOKENE_DB_MIGRATION_PASSWORD:?Set DOKENE_DB_MIGRATION_PASSWORD in .env}
      DOKENE_DB_RUNTIME_PASSWORD: ${DOKENE_DB_RUNTIME_PASSWORD:?Set DOKENE_DB_RUNTIME_PASSWORD in .env}
    ports:
      # Loopback only. Change the host port if another PostgreSQL already listens on 5432.
      - "127.0.0.1:${DOKENE_DB_HOST_PORT:-5432}:5432"
    volumes:
      - dokene-postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    build:
      context: ./infra/docker/keycloak
      dockerfile: Dockerfile
    image: dokene-keycloak:local
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -z "$$KC_BOOTSTRAP_ADMIN_USERNAME" ]; then
          echo "Error: Set KC_BOOTSTRAP_ADMIN_USERNAME in .env" >&2
          exit 1
        fi
        if [ -z "$$KC_BOOTSTRAP_ADMIN_PASSWORD" ]; then
          echo "Error: Set KC_BOOTSTRAP_ADMIN_PASSWORD in .env" >&2
          exit 1
        fi
        if [ -z "$$DOKENE_OIDC_CLIENT_SECRET" ]; then
          echo "Error: Set SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_SECRET in .env" >&2
          exit 1
        fi
        escape_json() {
          local str="$$1"
          str="$${str//\\/\\\\}"
          str="$${str//\"/\\\"}"
          str="$${str//$$'\b'/\\b}"
          str="$${str//$$'\f'/\\f}"
          str="$${str//$$'\n'/\\n}"
          str="$${str//$$'\r'/\\r}"
          str="$${str//$$'\t'/\\t}"
          for i in $$(seq 1 31); do
            case "$$i" in
              8|9|10|12|13) continue ;;
            esac
            printf -v hex "%02x" "$$i"
            printf -v ctrl "%b" "\x$$hex"
            str="$${str//$$ctrl/\\u00$$hex}"
          done
          printf "%s" "$$str"
        }
        mkdir -p /opt/keycloak/data/import
        content="$$(cat /opt/keycloak/import-template/dokene-realm.json)"
        escaped_secret="$$(escape_json "$$DOKENE_OIDC_CLIENT_SECRET")"
        escaped_password="$$(escape_json "$$DOKENE_TEST_USER_PASSWORD")"
        content="$${content//"\$${env.DOKENE_OIDC_CLIENT_SECRET}"/"$$escaped_secret"}"
        content="$${content//"\$${env.DOKENE_TEST_USER_PASSWORD}"/"$$escaped_password"}"
        printf "%s\n" "$$content" > /opt/keycloak/data/import/dokene-realm.json
        exec /opt/keycloak/bin/kc.sh start --optimized --http-enabled=true --hostname-strict=false --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      DOKENE_OIDC_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_SECRET:-}
      DOKENE_TEST_USER_PASSWORD: ${DOKENE_TEST_USER_PASSWORD:-testpassword}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/docker/keycloak/import:/opt/keycloak/import-template:ro
    healthcheck:
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/dokene/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s
      start_interval: 2s

  # Same-origin address for the OIDC issuer inside Docker.
  # The browser reaches Keycloak at http://localhost:${KEYCLOAK_PORT}; the backend must use the very same
  # issuer URL (it is also the key of the stored OIDC identity mappings), but `localhost` inside the backend
  # container is the container itself. This sidecar forwards localhost:${KEYCLOAK_PORT} to the Keycloak service
  # and owns the network namespace that the backend joins (`network_mode: service:oidc-bridge`), so both sides see
  # an identical issuer. The sidecar, not the backend, owns the namespace because the backend is the service that is
  # recreated routinely (code or DOKENE_* changes); the namespace must outlive those recreations. The backend's
  # published port and its `backend` DNS alias therefore live here.
  oidc-bridge:
    image: alpine/socat:1.8.0.3
    networks:
      default:
        aliases: [backend]
    ports:
      # Published for the OIDC callback (registered in Keycloak) and for API tools such as seed-local-qa.sh.
      - "127.0.0.1:8080:8080"
    user: "65534:65534"
    command: ["-d", "TCP-LISTEN:${KEYCLOAK_PORT:-8081},fork,reuseaddr,bind=127.0.0.1", "TCP:keycloak:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # A bridge that failed to attach to the Compose network (e.g. an earlier `up` died on a port bind error and left
    # the container created but network-less) listens fine yet cannot use the Compose DNS. Resolving its own service
    # name works only when it is attached to the network (and does not depend on Keycloak being up), so that state
    # fails fast instead of surfacing as a backend timeout.
    # The name is absolute (trailing dot) on purpose: BusyBox `nslookup` appends the host's DNS search domain to
    # relative names and does not fall back to the bare name, so a relative probe fails on such hosts (#171).
    healthcheck:
      test: ["CMD-SHELL", "nslookup oidc-bridge. >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    depends_on:
      keycloak:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend/Dockerfile
      additional_contexts:
        entrypoint: ./infra/docker/backend
    image: dokene-backend:local
    network_mode: "service:oidc-bridge"
    depends_on:
      oidc-bridge:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Inside Compose the database is `postgres:5432`; DOKENE_DB_URL in .env (localhost) is for host-run backends.
      DOKENE_DB_URL: jdbc:postgresql://postgres:5432/${DOKENE_DB_NAME:?Set DOKENE_DB_NAME in .env}
      DOKENE_DB_USERNAME: ${DOKENE_DB_USERNAME:-dokene_runtime}
      DOKENE_DB_PASSWORD: ${DOKENE_DB_PASSWORD:?Set DOKENE_DB_PASSWORD in .env}
      DOKENE_DB_MIGRATION_USERNAME: ${DOKENE_DB_MIGRATION_USERNAME:-dokene_migration}
      DOKENE_DB_MIGRATION_PASSWORD: ${DOKENE_DB_MIGRATION_PASSWORD:?Set DOKENE_DB_MIGRATION_PASSWORD in .env}
      DOKENE_TENANT_CONTEXT_SIGNING_KEY: ${DOKENE_TENANT_CONTEXT_SIGNING_KEY:?Set DOKENE_TENANT_CONTEXT_SIGNING_KEY in .env}
      DOKENE_TENANT_CONTEXT_KEY_ID: ${DOKENE_TENANT_CONTEXT_KEY_ID:-default}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_PROVIDER: dokene
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_ID:-dokene-bff}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_SECRET:?Set SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_CLIENT_SECRET in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_SCOPE: openid,profile
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DOKENE_REDIRECT_URI: "{baseUrl}/login/oauth2/code/{registrationId}"
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DOKENE_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/dokene
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      DOKENE_SESSION_COOKIE_SECURE: ${DOKENE_SESSION_COOKIE_SECURE:-false}
      DOKENE_SESSION_TIMEOUT: ${DOKENE_SESSION_TIMEOUT:-30m}
      DOKENE_CORS_ALLOWED_ORIGINS: ${DOKENE_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DOKENE_POST_LOGIN_REDIRECT_URL: ${DOKENE_POST_LOGIN_REDIRECT_URL:-http://localhost:5173/}
      DOKENE_POST_LOGIN_FAILURE_REDIRECT_URL: ${DOKENE_POST_LOGIN_FAILURE_REDIRECT_URL:-http://localhost:5173/?error=login_failed}
      DOKENE_PROVISIONING_ENABLED: ${DOKENE_PROVISIONING_ENABLED:-true}
      DOKENE_AI_PROVIDER: ${DOKENE_AI_PROVIDER:-}
      DOKENE_AI_OPENAI_API_KEY: ${DOKENE_AI_OPENAI_API_KEY:-}
      DOKENE_AI_OPENAI_MODEL: ${DOKENE_AI_OPENAI_MODEL:-gpt-6-luna}
      DOKENE_AI_OPENAI_BASE_URL: ${DOKENE_AI_OPENAI_BASE_URL:-}
      DOKENE_AI_OPENAI_TIMEOUT: ${DOKENE_AI_OPENAI_TIMEOUT:-15s}
      DOKENE_AI_OPENAI_MAX_RETRIES: ${DOKENE_AI_OPENAI_MAX_RETRIES:-0}
      DOKENE_AI_RETRY_MAX_ATTEMPTS: ${DOKENE_AI_RETRY_MAX_ATTEMPTS:-2}
      DOKENE_AI_RETRY_INITIAL_BACKOFF: ${DOKENE_AI_RETRY_INITIAL_BACKOFF:-250ms}
      DOKENE_AI_RETRY_MAX_BACKOFF: ${DOKENE_AI_RETRY_MAX_BACKOFF:-2s}
      DOKENE_AI_RETRY_MIN_ATTEMPT_BUDGET: ${DOKENE_AI_RETRY_MIN_ATTEMPT_BUDGET:-1s}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend/Dockerfile
      additional_contexts:
        nginx: ./infra/docker/frontend
    image: dokene-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  dokene-postgres:
