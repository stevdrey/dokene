# ABOUTME: Suite #149 isolation override: runs a second dev stack beside a standard one on the same host. Own image
# ABOUTME: tags and shifted loopback ports; curl reaches it through CURL_HOME=out/curlhome (see isolated149.sh).
#
# Inside the stack nothing changes: the issuer stays http://localhost:8081 and the BFF answers as localhost:8080, so the
# OIDC redirect URIs in the realm still match. Only the host side moves: 8080 -> 28080, 8081 -> 28081,
# 5173 -> 25173, 5432 -> 25432. Use it with COMPOSE_PROJECT_NAME=dokene-qa149.
services:
  postgres:
    ports: !override
      - "127.0.0.1:25432:5432"
  keycloak:
    image: dokene-keycloak:qa149
    ports: !override
      - "127.0.0.1:28081:8080"
  oidc-bridge:
    ports: !override
      - "127.0.0.1:28080:8080"
  backend:
    image: dokene-backend:qa149
  frontend:
    image: dokene-frontend:qa149
    ports: !override
      - "127.0.0.1:25173:8080"
